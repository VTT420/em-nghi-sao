<!DOCTYPE html><!DOCTYPE html><!DOCTYPE html><!DOCTYPE html<!DOCTYPE html<!DOCTYPE html>><!DOCTYPE html><!DOCTYPE html<html lang="vi"><!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<title>Em nghĩ sao</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e8, #ffeef6);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .hop {
    background: white;
    padding: 28px 24px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    max-width: 90%;
    z-index: 2;
  }

  img {
    width: 180px;
    border-radius: 14px;
    margin-bottom: 18px;
  }

  h2 {
    line-height: 1.4;
    margin-bottom: 20px;
  }

  button {
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 8px;
  }

  #yes {
    background-color: #ff5c8a;
    color: white;
  }

  #no {
    background-color: #e0e0e0;
    position: absolute;
  }

  .signature {
    margin-top: 16px;
    font-style: italic;
    color: #555;
  }

  .trai-tim {
    position: fixed;
    font-size: 20px;
    animation: bay 2.5s linear forwards;
  }

  @keyframes bay {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-100vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="hop" id="content">
  <!-- MÈO THẬP THÒ, NGẠI NGẠI -->
  <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="shy cat">

  <h2>
    Hà có thể cho Tiến 1 cơ hội <br>
    để mình tìm hiểu nhau thêm 1 lần nữa không...
  </h2>

  <button id="yes" onclick="yesClick()">Có</button>
  <button id="no" onclick="moveNo()" ontouchstart="moveNo()">Không</button>
</div>

<!-- Nhạc YouTube (ẩn – chỉ chạy khi bấm Có) -->
<iframe
  id="music"
  width="0"
  height="0"
  style="display:none"
  allow="autoplay">
</iframe>

<script>
function yesClick() {
  document.getElementById("content").innerHTML = `
    <h2>
      💖 Cảm ơn em vì đã tin tưởng anh thêm lần nữa<br>
      và 1 cơ hội để gần em hơn &lt;3
    </h2>
    <div class="signature">— làm cái này vì em. Tiến</div>
  `;

  // Nhạc chạy từ giây 20
  document.getElementById("music").src =
    "https://www.youtube.com/embed/UgkmUWthTx0?start=20&autoplay=1";

  taoTraiTim();
}

function moveNo() {
  const noBtn = document.getElementById("no");
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

function taoTraiTim() {
  for (let i = 0; i < 25; i++) {
    const heart = document.createElement("div");
    heart.className = "trai-tim";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.bottom = "0px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 2500);
  }
}
</script>

</body>
</html>
